<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>女巫的晚宴请柬</title>
    <link rel="stylesheet" href="opening.css" />
  </head>
  <body>
    <div class="opening-bg"></div>
    <div class="paper-edge left"></div>
    <div class="paper-edge right"></div>
    <div id="starfield" aria-hidden="true"></div>
    <div class="opening-content">
      <div class="opening-caption">A secret supper</div>
      <h1>女巫的毒药</h1>
      <div class="opening-deck">
        <div class="orbit-ring"></div>
        <div class="orbit-ring second"></div>
        <div class="opening-card pumpkin">
          <div class="flip">
            <div class="card-back">☾<small>One little secret</small></div>
            <div class="card-front">
              <span class="corner-star">✦</span
              ><img
                src="../assets/halloween/avatar-you.webp"
                alt="小南瓜"
              /><strong>小南瓜</strong><small>Pumpkin witch</small
              ><span class="card-symbol">✦</span>
            </div>
          </div>
        </div>
        <div class="opening-card moon">
          <div class="flip">
            <div class="card-back">✦<small>One little secret</small></div>
            <div class="card-front">
              <span class="corner-star">☾</span
              ><img
                src="../assets/halloween/avatar-witch.webp"
                alt="小月亮"
              /><strong>小月亮</strong><small>Moon witch</small
              ><span class="card-symbol">☾</span>
            </div>
          </div>
        </div>
        <div class="duel-seal">VS</div>
      </div>
      <p class="opening-line">两份秘密，一桌好戏。</p>
      <span class="opening-script">Trick, treat & a tiny secret</span>
    </div>
    <img
      class="opening-sticker cat"
      src="../assets/journal-v5/cat.png"
      alt=""
    /><img
      class="opening-sticker pot"
      src="../assets/journal-v5/cauldron.png"
      alt=""
    /><img
      class="opening-sticker hat"
      src="../assets/journal-v5/purple-hat.png"
      alt=""
    /><img
      class="opening-sticker cake"
      src="../assets/journal-v5/cupcake.png"
      alt=""
    />
    <button id="skip" type="button">进入晚宴 ›</button>
    <p class="gesture-hint" aria-live="polite">上滑开启秘密晚宴</p>
    <script src="opening.js"></script>
  </body>
</html>
