name: 游戏问题反馈
description: 报告卡住、操作异常、存档或联机问题。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: 请勿提供密码、API 密钥或完整浏览器存储。截图上传前请遮住私人信息。
  - type: dropdown
    id: mode
    attributes:
      label: 出现问题的模式
      options:
        - 和女巫玩
        - 双人同屏
        - 双人联机
        - 开场、主界面或其他
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备、系统和浏览器版本
      placeholder: 例如 Android 16 / Chrome 版本号，或 Windows 11 / Edge 版本号。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现
      description: 从哪个页面开始、依次做了什么？请写出别人可以照着操作的步骤。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果与实际结果
      description: 可以附截图。联机问题请补充两端网络和是否刷新、关闭过页面。
    validations:
      required: true
